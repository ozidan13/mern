<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) · الصفحة غير موجودة — FullStack Academy</title>
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <div class="fsa-shell">
    <header class="fsa-topbar">
      <div class="fsa-topbar__start">
        <a href="index.html" class="fsa-topbar__brand">
          <span>FullStack Academy</span>
        </a>
      </div>
      <div class="fsa-topbar__end">
        <button id="themeToggleBtn" class="fsa-btn fsa-btn--ghost fsa-btn--icon" data-fsa-theme-toggle aria-label="Toggle Theme">
          <svg><use href="assets/icons.svg#fsa-icon-sun"></use></svg>
        </button>
      </div>
    </header>

    <main class="fsa-main" style="display: flex; align-items: center; justify-content: center; min-height: 70vh;">
      <div class="fsa-card" style="max-width: 540px; text-align: center; padding: var(--space-8);">
        <div style="font-size: var(--fs-3xl); font-weight: 800; font-family: var(--font-mono); color: var(--accent-warning); margin-block-end: var(--space-2);">
          404
        </div>
        <h2>Page Not Found · الصفحة غير موجودة</h2>
        <p style="color: var(--text-secondary); margin-block: var(--space-3);">
          The lesson or document you are looking for does not exist or has been relocated.
        </p>
        <p class="fsa-ar" dir="rtl" style="color: var(--text-muted); font-size: var(--fs-sm); margin-block-end: var(--space-6);">
          لم نتمكن من العثور على الصفحة المطلوبة. يمكنك البحث في الفهرس أو العودة للصفحة الرئيسية.
        </p>

        <div style="display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap;">
          <a href="index.html" class="fsa-btn fsa-btn--primary">
            <span>Home · الرئيسية</span>
          </a>
          <a href="search.html" class="fsa-btn fsa-btn--ghost">
            <span>Search · البحث</span>
          </a>
          <a href="learn/index.html" class="fsa-btn fsa-btn--ghost">
            <span>Curriculum · المسارات</span>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/fsa-namespace.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
